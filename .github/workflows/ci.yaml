name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ==============================================================================
# Shared conventions across jobs
# ==============================================================================
# - Container: nimlang/nim:2.2.10 (Debian trixie, glibc 2.41). nim-z3 targets
#   Nim 2.2.10; 2.2.0 rejects funcdecl.nim's typed tuples ("Mixing types and
#   values in tuples is not allowed"), so the container version is load-bearing.
# - Z3: every job downloads a pinned upstream release into /opt/z3 rather than
#   apt's libz3 (which lags nim-z3's supported floor). The glibc suffix varies
#   by version — 4.13.x/4.14.x ship x64-glibc-2.35, 4.15.x/4.16.x ship
#   x64-glibc-2.39; the container's glibc 2.41 runs both. softlink's dynlib
#   pattern finds the unsuffixed libz3.so symlink in the tarball.
# - milpa: installed from the impls/python subdirectory (the repo root has no
#   pyproject.toml since milpa went multi-impl).

jobs:
  # ============================================================================
  # Multi-version matrix — Z3 4.13.x → 4.16.x, both Nim backends. The Z3
  # version is the only variable across rows (that's why we pin upstream
  # releases instead of a single apt libz3).
  # ============================================================================
  matrix-test:
    runs-on: ubuntu-latest
    container: nimlang/nim:2.2.10
    strategy:
      fail-fast: false
      matrix:
        # One point release per supported major.minor (README: 4.13.x–4.16.x).
        z3:
          - "4.13.4"
          - "4.14.1"
          - "4.15.8"
          - "4.16.0"
    steps:
      - uses: actions/checkout@v6

      - name: trust workdir for git (container uid mismatch w/ runner)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install build prerequisites
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl unzip python3 python3-pip pipx git build-essential

      - name: install Z3 ${{ matrix.z3 }} from upstream release
        run: |
          set -euo pipefail
          ver="${{ matrix.z3 }}"
          # 4.13.x/4.14.x → glibc-2.35; 4.15.x/4.16.x → glibc-2.39. Container
          # glibc (2.41) is newer than both, so either binary loads.
          case "$ver" in
            4.13.*|4.14.*) g=2.35 ;;
            *)             g=2.39 ;;
          esac
          base="z3-${ver}-x64-glibc-${g}"
          curl -fsSL -o /tmp/z3.zip \
            "https://github.com/Z3Prover/z3/releases/download/z3-${ver}/${base}.zip"
          unzip -q /tmp/z3.zip -d /opt
          mv "/opt/${base}" /opt/z3
          /opt/z3/bin/z3 --version
          echo "/opt/z3/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/z3/bin" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=/opt/z3/include" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=/opt/z3/include" >> "$GITHUB_ENV"

      - name: install milpa (Nim dep resolver)
        run: |
          pipx install --include-deps \
            "git+https://github.com/coreyleavitt/milpa.git#subdirectory=impls/python"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: milpa fetch (resolve softlink + proptest, emit nim.cfg)
        run: milpa fetch

      - name: test suite
        # Both backends (c + cpp), via run-tests.sh (milpa resolves deps + emits
        # nim.cfg; no nimble). tversion.nim asserts major==4 && minor>=10 on the
        # row's libz3; a row whose libz3 fails to load fails inside that probe.
        run: bash run-tests.sh test

  # ============================================================================
  # Gate-flag matrix — z3WithoutX umbrella gates under a representative set of
  # compile-time flag combinations. Each row compiles + runs tminimal.nim on
  # both backends: core surface still works, gated families are hidden.
  # ============================================================================
  gate-flags:
    runs-on: ubuntu-latest
    container: nimlang/nim:2.2.10
    strategy:
      fail-fast: false
      matrix:
        flags:
          - ""   # default — no gates; ensures tminimal core works unflagged
          - "-d:z3WithoutFP"
          - "-d:z3WithoutSeq"
          - "-d:z3WithoutTactics"
          - "-d:z3WithoutPropagator"
          - "-d:z3WithoutSpacer"
          - "-d:z3WithoutFixedpointCallbacks"
          - >-
            -d:z3WithoutFP -d:z3WithoutSeq -d:z3WithoutStrings
            -d:z3WithoutRegex -d:z3WithoutFuncDecl -d:z3WithoutDatatypes
            -d:z3WithoutOptimize -d:z3WithoutTactics
            -d:z3WithoutPropagator -d:z3WithoutSpacer
            -d:z3WithoutFixedpointCallbacks
    steps:
      - uses: actions/checkout@v6

      - name: trust workdir for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install build prerequisites
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl unzip python3 python3-pip pipx git build-essential

      - name: install Z3 (supported release)
        run: |
          set -euo pipefail
          base="z3-4.16.0-x64-glibc-2.39"
          curl -fsSL -o /tmp/z3.zip \
            "https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/${base}.zip"
          unzip -q /tmp/z3.zip -d /opt && mv "/opt/${base}" /opt/z3
          echo "/opt/z3/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/z3/bin" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=/opt/z3/include" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=/opt/z3/include" >> "$GITHUB_ENV"

      - name: install milpa
        run: |
          pipx install --include-deps \
            "git+https://github.com/coreyleavitt/milpa.git#subdirectory=impls/python"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: milpa fetch
        run: milpa fetch

      - name: compile + run tminimal under flags "${{ matrix.flags }}"
        run: |
          nim c -r --threads:on --hints:off ${{ matrix.flags }} tests/tminimal.nim
          nim cpp -r --threads:on --hints:off ${{ matrix.flags }} tests/tminimal.nim

  # ============================================================================
  # Gated fixedpoint-callback test files — each of the four files carrying the
  # `when defined(z3WithoutFixedpointCallbacks): suite ... skip()` guard must
  # compile + skip cleanly under the flag (gate-flags only proves tminimal's
  # scope-hiding checks; this closes the gap for the real test files).
  # ============================================================================
  gate-fixedpoint-callbacks-skip-suite:
    runs-on: ubuntu-latest
    container: nimlang/nim:2.2.10
    strategy:
      fail-fast: false
      matrix:
        file:
          - tests/tfixedpoint_ctxbox.nim
          - tests/tfixedpoint_handlers.nim
          - tests/tfixedpoint_newlemma.nim
          - tests/tfixedpoint_typed_callbacks.nim
    steps:
      - uses: actions/checkout@v6

      - name: trust workdir for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install build prerequisites
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl unzip python3 python3-pip pipx git build-essential

      - name: install Z3 (supported release)
        run: |
          set -euo pipefail
          base="z3-4.16.0-x64-glibc-2.39"
          curl -fsSL -o /tmp/z3.zip \
            "https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/${base}.zip"
          unzip -q /tmp/z3.zip -d /opt && mv "/opt/${base}" /opt/z3
          echo "/opt/z3/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/z3/bin" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=/opt/z3/include" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=/opt/z3/include" >> "$GITHUB_ENV"

      - name: install milpa
        run: |
          pipx install --include-deps \
            "git+https://github.com/coreyleavitt/milpa.git#subdirectory=impls/python"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: milpa fetch
        run: milpa fetch

      - name: compile + run ${{ matrix.file }} under -d:z3WithoutFixedpointCallbacks
        run: |
          nim c -r --threads:on --hints:off -d:z3WithoutFixedpointCallbacks ${{ matrix.file }}
          nim cpp -r --threads:on --hints:off -d:z3WithoutFixedpointCallbacks ${{ matrix.file }}

  # ============================================================================
  # AddressSanitizer — lifecycle bug catcher (use-after-free in =destroy,
  # double dec_ref, etc.). -d:useMalloc makes Nim's heap visible to ASAN.
  # Restricted to the lifecycle-critical tests + the box/ctx-registry/ctx-
  # release regressions (ADR-FC-0002/0011/0012/0013).
  # ============================================================================
  asan:
    runs-on: ubuntu-latest
    container: nimlang/nim:2.2.10
    steps:
      - uses: actions/checkout@v6

      - name: trust workdir for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install build prerequisites
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl unzip python3 python3-pip pipx git build-essential

      - name: install Z3 (supported release)
        run: |
          set -euo pipefail
          base="z3-4.16.0-x64-glibc-2.39"
          curl -fsSL -o /tmp/z3.zip \
            "https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/${base}.zip"
          unzip -q /tmp/z3.zip -d /opt && mv "/opt/${base}" /opt/z3
          echo "/opt/z3/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/z3/bin" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=/opt/z3/include" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=/opt/z3/include" >> "$GITHUB_ENV"

      - name: install milpa
        run: |
          pipx install --include-deps \
            "git+https://github.com/coreyleavitt/milpa.git#subdirectory=impls/python"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: milpa fetch
        run: milpa fetch

      - name: run lifecycle tests under ASAN
        env:
          # Z3 has intentional internal leaks (static caches, singleton config);
          # turn off leak detection so we report only actionable classes —
          # use-after-free, buffer overflow, double-free.
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=0:halt_on_error=0"
        run: |
          set -e
          for t in tests/tcontext.nim tests/tast.nim tests/tboolean.nim \
                   tests/tarith.nim tests/tsolver.nim tests/tmodel.nim \
                   tests/tbitvec.nim tests/tversion.nim \
                   tests/tfixedpoint_ctxbox.nim tests/tcontext_registry.nim \
                   tests/td3_ctx_release.nim tests/tfixedpoint_typed_callbacks.nim; do
            echo "=== ASAN: $t ==="
            # -lstdc++: the C backend produces a C binary, but libz3 is C++ and
            # throws internally. Without libstdc++ loaded at startup, ASAN's
            # __cxa_throw interceptor sees a NULL real symbol on the first throw
            # ("CHECK failed: real___cxa_throw != 0"). Linking it fixes that.
            nim c -r --threads:on --hints:off -d:useMalloc \
              --passC:-fsanitize=address --passL:-fsanitize=address \
              --passL:-lstdc++ --debugger:native "$t"
          done

  # ============================================================================
  # Counting-hook proofs — destructor-firing-count regressions (RFC probe FACT
  # B): ADR-FC-0002 (FixedpointCtxBox) and ADR-FC-0012/0013 (Z3ContextOwn /
  # context-table). Assert a =destroy hook fires an EXACT count, behind
  # -d:z3FpBoxDestroyCount / -d:z3CtxDestroyCount.
  # ============================================================================
  counting-hooks:
    runs-on: ubuntu-latest
    container: nimlang/nim:2.2.10
    steps:
      - uses: actions/checkout@v6

      - name: trust workdir for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install build prerequisites
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl unzip python3 python3-pip pipx git build-essential

      - name: install Z3 (supported release)
        run: |
          set -euo pipefail
          base="z3-4.16.0-x64-glibc-2.39"
          curl -fsSL -o /tmp/z3.zip \
            "https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/${base}.zip"
          unzip -q /tmp/z3.zip -d /opt && mv "/opt/${base}" /opt/z3
          echo "/opt/z3/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/z3/bin" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=/opt/z3/include" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=/opt/z3/include" >> "$GITHUB_ENV"

      - name: install milpa
        run: |
          pipx install --include-deps \
            "git+https://github.com/coreyleavitt/milpa.git#subdirectory=impls/python"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: milpa fetch
        run: milpa fetch

      - name: FixedpointCtxBox destroy-count proof (ADR-FC-0002, probe FACT B)
        run: |
          nim c   -r --threads:on --hints:off -d:useMalloc -d:z3FpBoxDestroyCount tests/tfixedpoint_ctxbox.nim
          nim cpp -r --threads:on --hints:off -d:useMalloc -d:z3FpBoxDestroyCount tests/tfixedpoint_ctxbox.nim

      - name: Z3ContextOwn destroy-count proof (ADR-FC-0012/0013, probe FACT B)
        run: |
          nim c   -r --threads:on --hints:off -d:useMalloc -d:z3CtxDestroyCount tests/td3_ctx_release.nim
          nim cpp -r --threads:on --hints:off -d:useMalloc -d:z3CtxDestroyCount tests/td3_ctx_release.nim
