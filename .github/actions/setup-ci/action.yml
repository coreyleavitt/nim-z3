name: "Set up a nim-z3 CI job"
description: >
  Build prerequisites, the patched Nim toolchain, a pinned upstream Z3
  release, milpa, and the resolved dependency tree. Every job in ci.yaml
  starts with this, so the environment is defined once.

inputs:
  z3:
    description: "Upstream Z3 release to install into /opt/z3"
    required: false
    default: "4.16.0"

runs:
  using: composite
  steps:
    - name: install build prerequisites
      shell: bash
      run: |
        set -euo pipefail
        # The Nim artifact ships no C compiler; the runner supplies it.
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
          build-essential gcc g++ curl unzip jq xz-utils pipx git
        ldd --version | head -1
        gcc --version | head -1
        g++ --version | head -1

    - name: install the patched Nim toolchain (OCI artifact)
      uses: ./.github/actions/setup-nim-artifact
      with:
        tag: 2.2.10-linux-x64
        digest: sha256:aacc9dccde71dbd4576216b569c668d5fbf1a3090e56f73992bffb56c59a588c

    - name: install Z3 ${{ inputs.z3 }} from upstream release
      shell: bash
      env:
        Z3_VER: ${{ inputs.z3 }}
      run: |
        set -euo pipefail
        # Upstream builds carry a glibc floor in the asset name: 4.13.x and
        # 4.14.x ship x64-glibc-2.35, 4.15.x and later x64-glibc-2.39. The
        # runner (ubuntu-24.04, glibc 2.39) loads both.
        case "$Z3_VER" in
          4.13.*|4.14.*) g=2.35 ;;
          *)             g=2.39 ;;
        esac
        base="z3-${Z3_VER}-x64-glibc-${g}"
        curl -fsSL -o "$RUNNER_TEMP/z3.zip" \
          "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VER}/${base}.zip"
        sudo unzip -q "$RUNNER_TEMP/z3.zip" -d /opt
        sudo mv "/opt/${base}" /opt/z3
        /opt/z3/bin/z3 --version
        echo "/opt/z3/bin" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=/opt/z3/bin" >> "$GITHUB_ENV"
        echo "C_INCLUDE_PATH=/opt/z3/include" >> "$GITHUB_ENV"
        echo "CPLUS_INCLUDE_PATH=/opt/z3/include" >> "$GITHUB_ENV"

    - name: install milpa (Nim dep resolver)
      shell: bash
      run: |
        set -euo pipefail
        pipx install --include-deps \
          "git+https://github.com/coreyleavitt/milpa.git#subdirectory=impls/python"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: milpa fetch (resolve softlink + proptest, emit nim.cfg)
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"
        milpa fetch
        # Pin the C compiler. gcc is Nim's Linux default, but the artifact
        # brings no compiler of its own, so the choice is stated rather than
        # inherited. nim.cfg is regenerated by every `milpa fetch`.
        printf '\ncc = gcc\n' >> nim.cfg
