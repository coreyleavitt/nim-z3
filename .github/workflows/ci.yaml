name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================================
  # Multi-version matrix — Z3 4.10 → 4.13.x, both Nim backends.
  # ============================================================================
  #
  # We pull pre-built Z3 release tarballs from microsoft/z3 instead of
  # relying on the OS-default libz3-dev — the Ubuntu LTS package gives
  # only one version per runner, while the matrix needs to vary the Z3
  # version on a single host so that *Z3 version* is the only variable
  # across rows.
  #
  # Each row downloads `z3-X.Y.Z-x64-glibc-2.31.zip`, unpacks to
  # /opt/z3, and points the build at it via LD_LIBRARY_PATH (runtime
  # symbol resolution) + C_INCLUDE_PATH (softlink's _Static_assert
  # header verification).
  #
  # softlink's dynlib pattern `libz3.so(.4|.4.13|.4.12|.4.11|.4.10|)`
  # then finds the unsuffixed `libz3.so` symlink that ships in the
  # tarball regardless of which version is on PATH.
  matrix-test:
    runs-on: ubuntu-latest
    container: nimlang/nim:2.2.0
    strategy:
      fail-fast: false
      matrix:
        # Pinned point releases — one per major.minor we support.
        # Update by editing this matrix; the rest of the workflow
        # picks the version up automatically.
        z3:
          - "4.10.2"
          - "4.11.2"
          - "4.12.6"
          - "4.13.4"
    steps:
      - uses: actions/checkout@v6

      - name: trust workdir for git (container uid mismatch w/ runner)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install build prerequisites
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl unzip python3 python3-pip pipx git build-essential

      - name: install Z3 ${{ matrix.z3 }} from upstream release
        run: |
          set -euo pipefail
          ver="${{ matrix.z3 }}"
          # microsoft/z3 release artifact convention. The glibc-2.31
          # build runs on every Ubuntu LTS >= 20.04. If a future
          # release diverges from this name shape, override per-row
          # via matrix.include with explicit `artifact` keys.
          base="z3-${ver}-x64-glibc-2.31"
          url="https://github.com/Z3Prover/z3/releases/download/z3-${ver}/${base}.zip"
          curl -fsSL -o /tmp/z3.zip "$url"
          unzip -q /tmp/z3.zip -d /opt
          mv "/opt/${base}" /opt/z3
          /opt/z3/bin/z3 --version
          echo "Z3_HOME=/opt/z3" >> "$GITHUB_ENV"
          echo "/opt/z3/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/z3/bin" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=/opt/z3/include" >> "$GITHUB_ENV"

      - name: install milpa (Nim dep resolver)
        run: |
          pipx install --include-deps \
            git+https://github.com/coreyleavitt/milpa.git
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: milpa fetch (resolve softlink + proptest, emit nim.cfg)
        run: milpa fetch

      - name: nimble test
        # Runs both backends per z3.nimble's test task (c + cpp). The
        # tversion.nim probe asserts major==4 && minor>=10 on whichever
        # libz3 the row provides; any matrix row whose libz3 fails to
        # load (missing symbol, ABI drift) fails inside that probe.
        run: nimble -y test

  # ============================================================================
  # Gate-flag matrix — smoke-tests the z3WithoutX umbrella gates under
  # a representative set of compile-time flag combinations (v2.0+).
  # Best-effort: gated on the same private-dep blocker (#1) as the rest
  # of the matrix. Each row compiles + runs tests/tminimal.nim on both
  # backends to confirm the core surface still works and gated families
  # are hidden.
  # ============================================================================
  gate-flags:
    runs-on: ubuntu-latest
    container: nimlang/nim:2.2.0
    strategy:
      fail-fast: false
      matrix:
        flags:
          - ""   # default — no gates; ensures tminimal core works unflagged
          - "-d:z3WithoutFP"
          - "-d:z3WithoutSeq"
          - "-d:z3WithoutTactics"
          - "-d:z3WithoutPropagator"
          - "-d:z3WithoutSpacer"
          - "-d:z3WithoutFixedpointCallbacks"
          - >-
            -d:z3WithoutFP -d:z3WithoutSeq -d:z3WithoutStrings
            -d:z3WithoutRegex -d:z3WithoutFuncDecl -d:z3WithoutDatatypes
            -d:z3WithoutOptimize -d:z3WithoutTactics
            -d:z3WithoutPropagator -d:z3WithoutSpacer
            -d:z3WithoutFixedpointCallbacks
    steps:
      - uses: actions/checkout@v6

      - name: trust workdir for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install build prerequisites + libz3
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libz3-dev python3 python3-pip pipx git build-essential

      - name: install milpa
        run: |
          pipx install --include-deps \
            git+https://github.com/coreyleavitt/milpa.git
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: milpa fetch
        run: milpa fetch

      - name: compile + run tminimal under flags "${{ matrix.flags }}"
        run: |
          nim c -r --threads:on --hints:off ${{ matrix.flags }} tests/tminimal.nim
          nim cpp -r --threads:on --hints:off ${{ matrix.flags }} tests/tminimal.nim

  # ============================================================================
  # Gated fixedpoint-callback test files — proves each of the four test
  # files carrying the `when defined(z3WithoutFixedpointCallbacks): suite
  # ... skip()` guard (not just tminimal's scope-hiding checks) compiles
  # and skips cleanly under -d:z3WithoutFixedpointCallbacks. A
  # `-d:z3WithoutFixedpointCallbacks` row in the gate-flags matrix above
  # only proves tminimal's compiles() checks pass — it says nothing about
  # the gated test files themselves, since gate-flags only ever runs
  # tminimal.nim. This job closes that gap for all four of the RFC's
  # canonical integration-test files
  # (docs/RFC-fixedpoint-callbacks.md, slice C2).
  # ============================================================================
  gate-fixedpoint-callbacks-skip-suite:
    runs-on: ubuntu-latest
    container: nimlang/nim:2.2.0
    strategy:
      fail-fast: false
      matrix:
        file:
          - tests/tfixedpoint_ctxbox.nim
          - tests/tfixedpoint_handlers.nim
          - tests/tfixedpoint_newlemma.nim
          - tests/tfixedpoint_typed_callbacks.nim
    steps:
      - uses: actions/checkout@v6

      - name: trust workdir for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install build prerequisites + libz3
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libz3-dev python3 python3-pip pipx git build-essential

      - name: install milpa
        run: |
          pipx install --include-deps \
            git+https://github.com/coreyleavitt/milpa.git
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: milpa fetch
        run: milpa fetch

      - name: compile + run ${{ matrix.file }} under -d:z3WithoutFixedpointCallbacks
        run: |
          nim c -r --threads:on --hints:off -d:z3WithoutFixedpointCallbacks ${{ matrix.file }}
          nim cpp -r --threads:on --hints:off -d:z3WithoutFixedpointCallbacks ${{ matrix.file }}

  # ============================================================================
  # AddressSanitizer — lifecycle bug catcher (use-after-free in
  # =destroy, double dec_ref, etc.).
  # ============================================================================
  #
  # Runs against the OS-default libz3 only — the matrix above already
  # varies Z3; this varies the build mode. We use -d:useMalloc so that
  # Nim's heap is visible to ASAN (the default ORC allocator hides
  # allocations behind a custom shim ASAN can't track).
  #
  # Restricted to the lifecycle-critical tests (`tcontext`, `tast`, the
  # operator suites, solver/model/bitvec). The property suite is
  # excluded — it dwarfs ASAN's tolerance, and any lifecycle bug it
  # would surface should also surface in the smaller suites.
  #
  # Also includes the box/context-registry/ctx-release/stable-box-UAF
  # lifecycle regressions (ADR-FC-0002/0011/0012/0013, C1a): these are
  # exactly the tests the fixedpoint-callbacks + context-registry RFCs
  # designate as their UAF/double-free proofs, so ASAN needs to see them
  # to give those ADRs real CI coverage.
  asan:
    runs-on: ubuntu-latest
    container: nimlang/nim:2.2.0
    steps:
      - uses: actions/checkout@v6

      - name: trust workdir for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install build prerequisites + libz3
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libz3-dev z3 python3 python3-pip pipx git build-essential

      - name: install milpa
        run: |
          pipx install --include-deps \
            git+https://github.com/coreyleavitt/milpa.git
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: milpa fetch
        run: milpa fetch

      - name: run lifecycle tests under ASAN
        env:
          # Z3 has many intentional internal leaks (static caches,
          # singleton config); turn off leak detection so we report
          # only the bug classes we can act on — use-after-free,
          # buffer overflow, double-free.
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=0:halt_on_error=0"
        run: |
          set -e
          for t in tests/tcontext.nim tests/tast.nim tests/tboolean.nim \
                   tests/tarith.nim tests/tsolver.nim tests/tmodel.nim \
                   tests/tbitvec.nim tests/tversion.nim \
                   tests/tfixedpoint_ctxbox.nim tests/tcontext_registry.nim \
                   tests/td3_ctx_release.nim tests/tfixedpoint_typed_callbacks.nim; do
            echo "=== ASAN: $t ==="
            nim c -r --threads:on --hints:off -d:useMalloc \
              --passC:-fsanitize=address --passL:-fsanitize=address \
              --debugger:native "$t"
          done

  # ============================================================================
  # Counting-hook proofs — mechanism-pinned destructor-firing-count regressions
  # (RFC probe FACT B): ADR-FC-0002 (FixedpointCtxBox) and ADR-FC-0012/0013
  # (Z3ContextOwn / context-table, ctx-ref leak).
  # ============================================================================
  #
  # These assert a `=destroy` hook fires an EXACT count (N or 2N), not just
  # "no leak reported" — the designated mechanism proof the RFC calls for,
  # sitting behind `-d:z3FpBoxDestroyCount` / `-d:z3CtxDestroyCount` so the
  # counting instrumentation stays out of normal builds. Version-independent
  # and classification-immune (unlike valgrind, needs no suppression list),
  # so no new infra beyond what `asan` already sets up — OS-default libz3,
  # same container/milpa bootstrap. Runs on both Nim backends since the
  # `=destroy` hooks are backend-agnostic but the RFC's C1a stable-box UAF
  # history showed backend-specific lifetime bugs are possible.
  counting-hooks:
    runs-on: ubuntu-latest
    container: nimlang/nim:2.2.0
    steps:
      - uses: actions/checkout@v6

      - name: trust workdir for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install build prerequisites + libz3
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libz3-dev z3 python3 python3-pip pipx git build-essential

      - name: install milpa
        run: |
          pipx install --include-deps \
            git+https://github.com/coreyleavitt/milpa.git
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: milpa fetch
        run: milpa fetch

      - name: FixedpointCtxBox destroy-count proof (ADR-FC-0002, probe FACT B)
        run: |
          nim c   -r --threads:on --hints:off -d:useMalloc -d:z3FpBoxDestroyCount tests/tfixedpoint_ctxbox.nim
          nim cpp -r --threads:on --hints:off -d:useMalloc -d:z3FpBoxDestroyCount tests/tfixedpoint_ctxbox.nim

      - name: Z3ContextOwn destroy-count proof (ADR-FC-0012/0013, probe FACT B)
        run: |
          nim c   -r --threads:on --hints:off -d:useMalloc -d:z3CtxDestroyCount tests/td3_ctx_release.nim
          nim cpp -r --threads:on --hints:off -d:useMalloc -d:z3CtxDestroyCount tests/td3_ctx_release.nim
