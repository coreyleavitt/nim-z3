name: ci

on:
  push:
    # Every branch, so a pushed work branch is verified before it lands.
    branches: ['**']
  pull_request:
    branches: [main]

# ==============================================================================
# Shared conventions across jobs
# ==============================================================================
# - Runner: ubuntu-24.04 (glibc 2.39), no container. The former container,
#   nimlang/nim:2.2.10, is Debian bookworm (glibc 2.36), and Z3 4.15 and later
#   publish only glibc-2.39 Linux builds, so every 4.15+/4.16 job failed to
#   load libz3. Its /bin/sh was also dash, which rejects `set -o pipefail`.
# - Nim: the patched 2.2.10 toolchain, pulled as an OCI artifact and pinned by
#   digest (.github/actions/setup-nim-artifact, vendored from nelli). nim-z3
#   targets Nim 2.2.10; 2.2.0 rejects funcdecl.nim's typed tuples ("Mixing
#   types and values in tuples is not allowed"), so the version is
#   load-bearing. The artifact ships Nim alone: gcc/g++ come from apt and the
#   C compiler is pinned in nim.cfg.
# - Z3: every job downloads a pinned upstream release into /opt/z3 rather than
#   apt's libz3 (which lags nim-z3's supported floor). softlink's dynlib
#   pattern finds the unsuffixed libz3.so symlink in the tarball.
# - milpa: installed from the impls/python subdirectory (the repo root has no
#   pyproject.toml since milpa went multi-impl).
# - All of the above is .github/actions/setup-ci, shared by every job.

jobs:
  # ============================================================================
  # Multi-version matrix — Z3 4.13.x → 4.16.x, both Nim backends. The Z3
  # version is the only variable across rows (that's why we pin upstream
  # releases instead of a single apt libz3).
  # ============================================================================
  matrix-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # One point release per supported major.minor (README: 4.13.x–4.16.x).
        z3:
          - "4.13.4"
          - "4.14.1"
          - "4.15.8"
          - "4.16.0"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci
        with:
          z3: ${{ matrix.z3 }}

      - name: test suite
        # Both backends (c + cpp), via run-tests.sh (milpa resolves deps + emits
        # nim.cfg; no nimble). tversion.nim asserts (major, minor) >= (4, 10) on the
        # row's libz3; a row whose libz3 fails to load fails inside that probe.
        run: bash run-tests.sh test

      - name: examples
        # Every example on both backends. They are user-facing code that
        # nothing else compiles; examples/properties.nim went uncompilable
        # unnoticed while CI ran only the test suite.
        run: bash run-tests.sh examples

  # ============================================================================
  # Gate-flag matrix — z3WithoutX umbrella gates under a representative set of
  # compile-time flag combinations. Each row compiles + runs tminimal.nim on
  # both backends: core surface still works, gated families are hidden.
  # ============================================================================
  gate-flags:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flags:
          - ""   # default — no gates; ensures tminimal core works unflagged
          - "-d:z3WithoutFP"
          - "-d:z3WithoutSeq"
          - "-d:z3WithoutTactics"
          - "-d:z3WithoutPropagator"
          - "-d:z3WithoutSpacer"
          - "-d:z3WithoutFixedpointCallbacks"
          - >-
            -d:z3WithoutFP -d:z3WithoutSeq -d:z3WithoutStrings
            -d:z3WithoutRegex -d:z3WithoutFuncDecl -d:z3WithoutDatatypes
            -d:z3WithoutOptimize -d:z3WithoutTactics
            -d:z3WithoutPropagator -d:z3WithoutSpacer
            -d:z3WithoutFixedpointCallbacks
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci

      - name: compile + run tminimal under flags "${{ matrix.flags }}"
        run: |
          nim c -r --threads:on --hints:off ${{ matrix.flags }} tests/tminimal.nim
          nim cpp -r --threads:on --hints:off ${{ matrix.flags }} tests/tminimal.nim

  # ============================================================================
  # Gated fixedpoint-callback test files — each of the four files carrying the
  # `when defined(z3WithoutFixedpointCallbacks): suite ... skip()` guard must
  # compile + skip cleanly under the flag (gate-flags only proves tminimal's
  # scope-hiding checks; this closes the gap for the real test files).
  # ============================================================================
  gate-fixedpoint-callbacks-skip-suite:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        file:
          - tests/tfixedpoint_ctxbox.nim
          - tests/tfixedpoint_handlers.nim
          - tests/tfixedpoint_newlemma.nim
          - tests/tfixedpoint_typed_callbacks.nim
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci

      - name: compile + run ${{ matrix.file }} under -d:z3WithoutFixedpointCallbacks
        run: |
          nim c -r --threads:on --hints:off -d:z3WithoutFixedpointCallbacks ${{ matrix.file }}
          nim cpp -r --threads:on --hints:off -d:z3WithoutFixedpointCallbacks ${{ matrix.file }}

  # ============================================================================
  # AddressSanitizer + LeakSanitizer — lifecycle bug catcher (use-after-free
  # in =destroy, a premature release, an unreleased handle). -d:useMalloc
  # makes Nim's heap visible to ASan. The list (run-tests.sh ASAN) is the
  # lifecycle-critical tests, the box/ctx-registry/ctx-release regressions
  # (ADR-FC-0002/0011/0012/0013) and every family with a hand-written hook.
  # ============================================================================
  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci

      - name: lower mmap ASLR entropy for ASan
        # The ubuntu-24.04 runner kernel uses vm.mmap_rnd_bits=32, which
        # places mappings where ASan's shadow memory expects to be and
        # crashes instrumented binaries at startup with an endless
        # AddressSanitizer:DEADLYSIGNAL loop.
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: lifecycle tests under ASan + LSan
        # run-tests.sh asan: halt_on_error, so any invalid read, write or free
        # fails the run, and detect_leaks, so any unreachable block does too.
        # tests/lsan.supp may name Z3-internal frames only, each with its
        # reason. -lstdc++ and the other flags live in run-tests.sh.
        run: bash run-tests.sh asan

      - name: the gate catches a planted bad release
        # tgate_canary under -d:z3GateCanary over-releases a context
        # reference; this step passes only if ASan reports the
        # heap-use-after-free, so a gate that cannot fail is caught here.
        run: bash run-tests.sh asan-canary

  # ============================================================================
  # Counting-hook proofs — destructor-firing-count regressions (RFC probe FACT
  # B): ADR-FC-0002 (FixedpointCtxBox) and ADR-FC-0012/0013 (Z3ContextOwn /
  # context-table). Assert a =destroy hook fires an EXACT count, behind
  # -d:z3FpBoxDestroyCount / -d:z3CtxDestroyCount.
  # ============================================================================
  counting-hooks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci

      - name: destroy-count proofs (ADR-FC-0002/0012/0013, probe FACT B)
        # td3_ctx_release, thandle_ctx_release and thook_raise_path under
        # -d:z3CtxDestroyCount,
        # tterm_hooks_bound under -d:z3TermHookCount,
        # tfixedpoint_ctxbox under -d:z3FpBoxDestroyCount, c and cpp.
        run: bash run-tests.sh counting
