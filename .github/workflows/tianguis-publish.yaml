name: tianguis-publish

# Publishes z3 (this repo, coreyleavitt/nim-z3) to the tianguis Nim package
# registry as the author-signed package `z3` in namespace github.com/coreyleavitt.
#
# TWO ways to fire:
#   1. workflow_dispatch (manual, from the Actions tab) — pick a `ref` (tag or
#      SHA) to publish. Use this for the first smoke test and for re-publishing
#      an existing tag. The job checks out that exact ref, so `milpa publish`
#      packs the TAGGED tree, not the branch HEAD.
#   2. push of a "v*" tag — fires automatically ONLY when the tag is pushed with
#      a real credential (a human `git push --tags`, or a PAT-based workflow). A
#      tag created via `gh release create` with the default GITHUB_TOKEN does
#      NOT trigger further workflows (GitHub loop-prevention), so after such a
#      release, fire this manually (option 1) or push the tag by hand.
#
# Runs the composite action in this repo's OWN job (not a reusable-workflow
# `uses:` at the jobs: level) — required by tianguis's trust model: a composite
# action executes inside the calling job, so cosign's Fulcio cert SAN and the
# sigstore attestation signature are both stamped with THIS repo's own per-repo
# GitHub Actions identity. See coreyleavitt/tianguis's
# .github/actions/publish/action.yaml header + docs/adoption/github.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or SHA to publish (e.g. v2.0.0) — checked out and packed."
        required: true
        default: "v2.0.0"
      dry-run:
        description: "Smoke test: still packs+pushes+signs the OCI artifact, but dispatch skips committing an index entry."
        type: boolean
        required: false
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # cosign keyless signing + the action's own
                        # sigstore-python attestation signing + the
                        # dispatch-endpoint bearer token — all three derive
                        # their identity from THIS job (the publish action is a
                        # composite action, not a reusable workflow).
      contents: read    # actions/checkout below
      packages: write   # push the OCI artifact to GHCR
    steps:
      - uses: actions/checkout@v6
        with:
          # On workflow_dispatch, check out the chosen ref (so the TAGGED tree
          # is published, not the default branch); on a tag push, github.ref
          # already points at the tag.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: coreyleavitt/tianguis/.github/actions/publish@main
        with:
          # The package's own declared name (milpa.kdl: name "z3"). Passed
          # explicitly because the composite action requires it; it matches the
          # milpa.kdl SSOT. The registry keys identity on ORIGIN
          # (github.com/coreyleavitt/nim-z3), not on this name — coexisting with
          # any other `z3` (e.g. github.com/zevv) is by design, not a collision.
          name: z3
          # The version passed to `milpa publish --version`. On a tag push this
          # is the tag (github.ref_name, e.g. "v2.0.0"); on manual dispatch it's
          # the chosen ref. milpa accepts a leading "v" and enforces that a
          # <version>/v<version> git tag points at HEAD.
          version: ${{ github.event.inputs.ref || github.ref_name }}
          # target: defaults to ghcr.io/coreyleavitt/nim-z3 (derived from
          # github.repository, lowercased) — no override needed.
          #
          # milpa is public, so no MILPA_GIT_READ_PAT is needed (the composite
          # action's milpa-git-read-pat input defaults to "" and is unused for
          # a public clone).
          #
          # dry-run: true on manual smoke (default above), false on a real tag push.
          dry-run: ${{ github.event.inputs.dry-run || 'false' }}

    # IMPORTANT (one-time, manual, GitHub package settings UI): a newly created
    # GHCR package defaults to PRIVATE. After the FIRST successful publish, set
    # it Public at
    # https://github.com/users/coreyleavitt/packages/container/nim-z3/settings
    # — otherwise milpa's unauthenticated `oras pull` on the CONSUMER side
    # (anyone installing z3 via tianguis) can't fetch it.
